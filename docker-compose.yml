services:
  minesweeper:
    build: .
    image: minesweeper-infinite:latest
    container_name: minesweeper-infinite
    ports:
      - "${HOST_PORT:-8420}:8420"
    environment:
      PORT: "8420"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8420/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
